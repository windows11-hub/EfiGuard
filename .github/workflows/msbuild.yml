name: Build EfiGuard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Clone EDK2
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git C:\edk2
          cd C:\edk2
          git submodule update --init --depth 1

      - name: Setup EDK2 environment
        shell: cmd
        run: |
          cd /d C:\edk2
          call edksetup.bat Rebuild

      - name: Set PACKAGES_PATH
        shell: cmd
        run: |
          set PACKAGES_PATH=C:\edk2;%GITHUB_WORKSPACE%
          echo PACKAGES_PATH=C:\edk2;%GITHUB_WORKSPACE% >> %GITHUB_ENV%

      - name: Build EfiGuard
        shell: cmd
        run: |
          cd /d C:\edk2
          call edksetup.bat
          build -p %GITHUB_WORKSPACE%\EfiGuardPkg\EfiGuardPkg.dsc -a X64 -t VS2022 -b RELEASE

      - name: List build output
        shell: cmd
        run: |
          dir /s /b C:\edk2\Build\EfiGuardPkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efiguard-build
          path: C:\edk2\Build\EfiGuardPkg\**\*.efi
          if-no-files-found: error
