name: Build EfiGuard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NASM
        shell: cmd
        run: |
          choco install nasm -y
          echo NASM_PREFIX=C:\Program Files\NASM\>> %GITHUB_ENV%

      - name: Clone EDK2
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git C:\edk2
          cd /d C:\edk2
          git submodule update --init --depth 1

      - name: Build BaseTools
        shell: cmd
        run: |
          cd /d C:\edk2
          call edksetup.bat Rebuild
          if errorlevel 1 exit /b 1
          if not exist C:\edk2\BaseTools\Bin\Win32 exit /b 1
          dir C:\edk2\BaseTools\Bin\Win32

      - name: Set PACKAGES_PATH
        shell: cmd
        run: |
          echo PACKAGES_PATH=C:\edk2;%GITHUB_WORKSPACE%>> %GITHUB_ENV%

      - name: Find DSC file
        shell: cmd
        run: |
          dir /s /b %GITHUB_WORKSPACE%\*.dsc

      - name: Build EfiGuard
        shell: cmd
        run: |
          cd /d C:\edk2
          call edksetup.bat
          build -p %GITHUB_WORKSPACE%\EfiGuardPkg\EfiGuardPkg.dsc -a X64 -t VS2022 -b RELEASE
          if errorlevel 1 exit /b 1

      - name: List build output
        shell: cmd
        run: |
          dir /s /b C:\edk2\Build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efiguard-build
          path: C:\edk2\Build\**\*.efi
          if-no-files-found: error
