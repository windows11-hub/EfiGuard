name: Build EfiGuard
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022   # EDK2 在 windows-2022 上更稳
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # EfiGuard 有子模块，必须拉

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Setup EDK2
        run: |
          git clone https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init
          # 设置 EDK2 环境变量，指向 EfiGuard
          # 具体路径取决于仓库结构

      - name: Build
        run: |
          # 调 EDK2 的 build 命令
          # 例如：build -p EfiGuardPkg/EfiGuardPkg.dsc -a X64 -t VS2022
                - name: Upload EfiGuard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efiguard-build
          path: |
            Build/**/*.efi
          if-no-files-found: error
